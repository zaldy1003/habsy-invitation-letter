name: Deploy invitation to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-zaldy1003ii-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate deployment settings
        run: node scripts/check-deploy-env.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GUEST_TOKEN_KEY: ${{ secrets.GUEST_TOKEN_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}

      - name: Install locked dependencies
        run: npm ci

      # Runtime secrets are deliberately NOT passed to the build step.
      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Check TypeScript
        run: npm run typecheck

      - name: Deploy Worker and sync runtime secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            SUPABASE_SECRET_KEY
            GUEST_TOKEN_KEY
            SUPABASE_URL
            APP_ORIGIN
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GUEST_TOKEN_KEY: ${{ secrets.GUEST_TOKEN_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
